<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나는 음악을 직업 삼아도 될까?</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 웹 폰트 (Pretendard) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* 트랜지션 및 기본 스타일 설정 */
    body { font-family: 'Pretendard', sans-serif; }
    .sub-item-container {
      transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
    }
    .sub-item-container.expanded {
      max-height: 100px;
      opacity: 1;
    }
    button { transition: all 0.2s ease; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 py-10 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto" id="app">
    <!-- 자바스크립트로 콘텐츠가 여기에 렌더링됩니다 -->
  </div>

  <script>
    // --- 1. 데이터 정의 ---
    const checklistData = [
      {
        id: 'product',
        title: 'Product (음악)',
        subtitle: '나의 본질적인 무기',
        icon: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
        color: 'bg-indigo-500',
        lightColor: 'bg-indigo-50',
        textColor: 'text-indigo-600',
        fillColorClass: 'fill-indigo-600/10 text-indigo-600',
        items: [
          { id: 'p1', text: '음악 하려는/하고있는 친구가 10명이 넘는다 (실음과 제외)', sub: { id: 'p1_sub', text: '난 그 집단 중 실력이 상위다' } },
          { id: 'p2', text: '나는 SNS에 게시물이 30개 이상이다 (음악만)', sub: { id: 'p2_sub', text: '난 팔로워가 1천명 이상이다' } },
          { id: 'p3', text: '나는 악보없이 카피가 가능하다' },
          { id: 'p4', text: '나는 100여곡 이상 카피해봤다' },
          { id: 'p5', text: '나는 코드를 외우고 있다' },
          { id: 'p6', text: '나는 자작곡이 5곡 이상이다' },
          { id: 'p7', text: '나는 공연 경험이 있다' },
          { id: 'p8', text: '나는 모르는 사람에게 칭찬을 받아본 적 있다' },
        ]
      },
      {
        id: 'price',
        title: 'Price (제작비/환경)',
        subtitle: '음악을 지속할 수 있는 자원',
        icon: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>',
        color: 'bg-emerald-500',
        lightColor: 'bg-emerald-50',
        textColor: 'text-emerald-600',
        fillColorClass: 'fill-emerald-600/10 text-emerald-600',
        items: [
          { id: 'pr1', text: '나는 믹스를 배운적이 있다. (유튜브 제외)' },
          { id: 'pr2', text: '나는 비트를 찍을줄 안다.' },
          { id: 'pr3', text: '나는 비트로 일하는 친구가 있다.' },
          { id: 'pr4', text: '나는 악기로 일하는 친구가 있다. (교회 포함)' },
          { id: 'pr5', text: '나는 오디오인터페이스를 가지고 있다.' },
          { id: 'pr6', text: '나는 마이크를 가지고 있다.' },
          { id: 'pr7', text: '나는 낯을 안 가린다.' },
          { id: 'pr8', text: '나는 집에서의 지원 or 돈이 많다.' },
          { id: 'pr9', text: '나는 잘 맞는 엔지니어가 있다.' },
          { id: 'pr10', text: '나는 트랙을 분리해서 듣는게 가능하다.' },
        ]
      },
      {
        id: 'place',
        title: 'Place (유통)',
        subtitle: '나의 음악이 세상에 나가는 통로',
        icon: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>',
        color: 'bg-amber-500',
        lightColor: 'bg-amber-50',
        textColor: 'text-amber-600',
        fillColorClass: 'fill-amber-600/10 text-amber-600',
        items: [
          { id: 'pl1', text: '나는 사업자등록증이 있다.' },
          { id: 'pl2', text: '나는 유통사를 5개 이상 알고있다.' },
          { id: 'pl3', text: '나는 내 소개서를 가지고 있다.' },
          { id: 'pl4', text: '나는 SNS페이지가 1만명 이상이다.' },
          { id: 'pl5', text: '나는 공연으로 100석을 팔 수 있다.' },
        ]
      },
      {
        id: 'promotion',
        title: 'Promotion (홍보)',
        subtitle: '나를 알리고 브랜딩하는 능력',
        icon: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>',
        color: 'bg-rose-500',
        lightColor: 'bg-rose-50',
        textColor: 'text-rose-600',
        fillColorClass: 'fill-rose-600/10 text-rose-600',
        items: [
          { id: 'pro1', text: '나는 핸드폰 외에 카메라가 있다.' },
          { id: 'pro2', text: '나는 영상편집툴을 다뤄봤다.' },
          { id: 'pro3', text: '나는 음악을 제외한 취미, 특기가 있다.' },
          { id: 'pro4', text: '나는 영상하는 친구가 있다.' },
          { id: 'pro5', text: '나는 인플루언서 친구가 있다.' },
        ]
      }
    ];

    // --- 2. 전역 상태 ---
    let checkedItems = new Set();
    
    // 총 항목 수 계산
    const totalItemsCount = checklistData.reduce((acc, section) => {
      let count = section.items.length;
      section.items.forEach(item => { if (item.sub) count += 1; });
      return acc + count;
    }, 0);

    // 공통 SVG 아이콘
    const ICONS = {
      trophy: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
      chevronRight: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
      circleEmpty: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>',
      circleChecked: (colorClass) => `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${colorClass}"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4" stroke="white" stroke-width="3" fill="none"/></svg>`
    };

    // 결과 코멘트 생성
    function getResultComment(count) {
      if (count === 0) return "아직 시작 전이군요! 첫 단추를 채워볼까요?";
      if (count <= 10) return "음악을 향한 열정이 빛납니다! 부족한 요소를 하나씩 채워가 보세요.";
      if (count <= 20) return "기본기가 탄탄하시네요! 이제 나만의 비즈니스 모델을 구체화할 타이밍입니다.";
      if (count <= 27) return "준비된 아티스트! 당장 앨범을 내고 활동해도 손색없는 인프라를 갖추셨습니다.";
      return "완벽 그 자체! 이미 프로이시거나, 곧 엄청난 성과를 낼 준비가 모두 끝났습니다.";
    }

    // --- 3. UI 렌더링 함수 ---
    function renderApp() {
      const appDiv = document.getElementById('app');
      
      let html = `
        <!-- 헤더 섹션 -->
        <div class="text-center mb-12">
          <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-4 tracking-tight">
            나는 음악을 <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-600">직업 삼아도</span> 될까?
          </h1>
          <p class="text-lg text-slate-600 font-medium">
            마케팅의 4P 전략으로 알아보는 나의 아티스트 자가 진단
          </p>
        </div>

        <!-- 진행 상태 바 -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-10 border border-slate-100 sticky top-4 z-10">
          <div class="flex justify-between items-end mb-2">
            <div>
              <p class="text-sm font-semibold text-slate-500 uppercase tracking-wider">나의 준비도</p>
              <h2 class="text-2xl font-bold text-slate-800">
                <span id="checked-count">0</span> <span class="text-base font-normal text-slate-500">/ ${totalItemsCount}</span>
              </h2>
            </div>
            <div class="text-right">
              <span id="progress-percent" class="text-3xl font-black text-indigo-600">0%</span>
            </div>
          </div>
          
          <div class="w-full bg-slate-100 rounded-full h-3 mb-4 overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-3 rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
          </div>
          
          <div class="bg-indigo-50 rounded-lg p-3 flex items-start gap-3">
            <div class="text-indigo-500 shrink-0 mt-0.5">${ICONS.trophy}</div>
            <p id="result-comment" class="text-sm font-medium text-indigo-800 leading-snug">
              ${getResultComment(0)}
            </p>
          </div>
        </div>

        <!-- 체크리스트 섹션들 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      `;

      checklistData.forEach(section => {
        const sectionTotal = section.items.reduce((sum, item) => sum + (item.sub ? 2 : 1), 0);
        
        html += `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
            <!-- 카드 헤더 -->
            <div class="${section.lightColor} p-5 border-b border-slate-100/50 flex items-center gap-4">
              <div class="${section.color} p-3 rounded-xl text-white shadow-sm">
                ${section.icon}
              </div>
              <div class="flex-1">
                <h3 class="text-xl font-bold text-slate-800">${section.title}</h3>
                <p class="text-sm font-medium ${section.textColor}">${section.subtitle}</p>
              </div>
              <div id="count-${section.id}" class="text-sm font-bold text-slate-400 bg-white px-2 py-1 rounded-md shadow-sm">
                0/${sectionTotal}
              </div>
            </div>

            <!-- 리스트 아이템 -->
            <div class="p-2 flex-1">
        `;

        section.items.forEach(item => {
          // 메인 항목
          html += `
            <div class="mb-1">
              <button onclick="toggleItem('${item.id}', null, '${section.id}')" id="btn-${item.id}" class="w-full text-left px-4 py-3 rounded-lg flex items-start gap-3 group hover:bg-slate-50">
                <div class="mt-0.5 shrink-0 transition-transform group-hover:scale-110" id="icon-${item.id}">
                  <span class="text-slate-300">${ICONS.circleEmpty}</span>
                </div>
                <span id="text-${item.id}" class="text-[15px] leading-snug text-slate-600 font-medium">
                  ${item.text}
                </span>
              </button>
          `;

          // 서브 항목
          if (item.sub) {
            html += `
              <div id="sub-container-${item.id}" class="sub-item-container">
                <button onclick="toggleItem('${item.sub.id}', '${item.id}', '${section.id}')" id="btn-${item.sub.id}" class="w-full text-left pl-11 pr-4 py-2.5 rounded-lg flex items-center gap-2 group hover:bg-slate-50">
                  <div class="text-slate-400 shrink-0">${ICONS.chevronRight}</div>
                  <div class="shrink-0 transition-transform group-hover:scale-110" id="icon-${item.sub.id}">
                    <span class="text-slate-300">${ICONS.circleEmpty}</span>
                  </div>
                  <span id="text-${item.sub.id}" class="text-sm text-slate-500">
                    ${item.sub.text}
                  </span>
                </button>
              </div>
            `;
          }
          html += `</div>`;
        });

        html += `
            </div>
          </div>
        `;
      });

      html += `
        </div>
        <div class="mt-12 flex flex-col items-center justify-center text-slate-400 text-sm pb-8 gap-3">
          <p>음악을 향한 당신의 도전을 응원합니다! 🎵</p>
          <a href="https://www.youtube.com/@GGondae_therecord" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-slate-500 hover:text-red-500 transition-colors font-medium bg-white border border-slate-200 shadow-sm px-4 py-2 rounded-full hover:shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.582 6.186a2.665 2.665 0 0 0-1.876-1.884C17.978 3.846 12 3.846 12 3.846s-5.978 0-7.706.456A2.665 2.665 0 0 0 2.418 6.186C1.964 7.924 1.964 12 1.964 12s0 4.076.454 5.814a2.665 2.665 0 0 0 1.876 1.884c1.728.456 7.706.456 7.706.456s5.978 0 7.706-.456a2.665 2.665 0 0 0 1.876-1.884C22.036 16.076 22.036 12 22.036 12s0-4.076-.454-5.814ZM9.957 15.485V8.515L15.932 12l-5.975 3.485Z"/></svg>
            제작 : 꼰대 더 레코드 유튜브
          </a>
        </div>
      `;

      appDiv.innerHTML = html;
    }

    // --- 4. 상호작용 및 UI 업데이트 로직 ---
    function toggleItem(id, parentId, sectionId) {
      if (checkedItems.has(id)) {
        // 이미 체크되어 있으면 해제
        checkedItems.delete(id);
        
        // 부모 해제 시, 자식도 같이 해제
        const parentItem = checklistData.flatMap(s => s.items).find(i => i.id === id);
        if (parentItem && parentItem.sub) {
          checkedItems.delete(parentItem.sub.id);
        }
      } else {
        // 체크하기
        checkedItems.add(id);
        
        // 서브 항목 체크 시 부모가 체크 안되어 있으면 자동 체크
        if (parentId && !checkedItems.has(parentId)) {
          checkedItems.add(parentId);
        }
      }
      
      updateUI();
    }

    function updateUI() {
      // 1. 전체 진행도 및 상단 상태 업데이트
      const count = checkedItems.size;
      const progress = Math.round((count / totalItemsCount) * 100);
      
      document.getElementById('checked-count').innerText = count;
      document.getElementById('progress-percent').innerText = `${progress}%`;
      document.getElementById('progress-bar').style.width = `${progress}%`;
      document.getElementById('result-comment').innerText = getResultComment(count);

      // 2. 각 항목의 버튼 스타일 및 섹션 카운트 업데이트
      checklistData.forEach(section => {
        let sectionCheckedCount = 0;
        
        section.items.forEach(item => {
          const isMainChecked = checkedItems.has(item.id);
          if (isMainChecked) sectionCheckedCount++;
          
          updateItemStyle(item.id, isMainChecked, section.fillColorClass);

          // 서브 항목 처리
          if (item.sub) {
            const isSubChecked = checkedItems.has(item.sub.id);
            if (isSubChecked) sectionCheckedCount++;
            
            updateItemStyle(item.sub.id, isSubChecked, section.fillColorClass);
            
            // 메인 항목 체크 여부에 따라 서브 항목 컨테이너 표시/숨김
            const subContainer = document.getElementById(`sub-container-${item.id}`);
            if (isMainChecked) {
              subContainer.classList.add('expanded');
            } else {
              subContainer.classList.remove('expanded');
            }
          }
        });

        // 섹션 카운트 업데이트
        const sectionTotal = section.items.reduce((sum, item) => sum + (item.sub ? 2 : 1), 0);
        document.getElementById(`count-${section.id}`).innerText = `${sectionCheckedCount}/${sectionTotal}`;
      });
    }

    function updateItemStyle(id, isChecked, fillColorClass) {
      const btn = document.getElementById(`btn-${id}`);
      const iconContainer = document.getElementById(`icon-${id}`);
      const textSpan = document.getElementById(`text-${id}`);

      if (isChecked) {
        btn.classList.add('bg-slate-50');
        // 메인 항목인지 서브 항목인지에 따라 텍스트 스타일 다르게
        textSpan.classList.remove('text-slate-600', 'text-slate-500', 'font-medium');
        textSpan.classList.add('text-slate-800', 'font-semibold');
        iconContainer.innerHTML = ICONS.circleChecked(fillColorClass);
      } else {
        btn.classList.remove('bg-slate-50');
        textSpan.classList.remove('text-slate-800', 'font-semibold');
        // id에 '_sub'가 포함되어 있으면 서브항목의 기본 텍스트 색상 적용
        if(id.includes('_sub')) {
           textSpan.classList.add('text-slate-500');
        } else {
           textSpan.classList.add('text-slate-600', 'font-medium');
        }
        iconContainer.innerHTML = `<span class="text-slate-300">${ICONS.circleEmpty}</span>`;
      }
    }

    // --- 5. 앱 초기화 ---
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
